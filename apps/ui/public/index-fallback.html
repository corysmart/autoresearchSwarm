<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Autoresearch Swarm API</title>
    <style>
      body {
        font-family: "Georgia", serif;
        background: linear-gradient(135deg, #f4efe2 0%, #d6e8e3 100%);
        color: #17313a;
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
      }
      main {
        max-width: 46rem;
        background: rgba(255,255,255,0.82);
        border: 1px solid rgba(23,49,58,0.15);
        border-radius: 18px;
        padding: 2rem;
        box-shadow: 0 20px 60px rgba(23,49,58,0.12);
      }
      a {
        color: #0f5964;
      }
      code {
        background: rgba(23,49,58,0.08);
        padding: 0.1rem 0.35rem;
        border-radius: 6px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Autoresearch Swarm Harness</h1>
      <p>The local API is running. The interactive React dashboard is served by the Vite UI process on <code>http://127.0.0.1:4173</code>.</p>
      <p>If the UI is not running yet, start the full harness with <code>npm run start</code>.</p>
      <p>Useful endpoints: <a href="/health">/health</a>, <a href="/api/swarm/stats">/api/swarm/stats</a>, <a href="/api/observability/events">/api/observability/events</a>.</p>
    </main>
  </body>
  </html>
